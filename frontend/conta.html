<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Sindesei DF</title>
    <link rel="stylesheet" href="assets/css/conta.css">
</head>

<body>

    <main>

        <header>
            <h1>Minha Conta</h1>
            <img src="assets/logos/Sindesei-DF-preto.svg" alt="Sindesei DF" class="logo">
        </header>

        <section class="profile-card">

            <div class="profile-info">
                <label for="foto" class="avatar-circle">
                    <img src="assets/icons/icon-imgPerson.svg" alt="Foto de perfil" id="foto-img">
                </label>
                <input type="file" id="foto" name="foto" accept="image/*">

                <div>
                    <h2 id="nome-topo">Carregando...</h2>
                    <p id="cargo-topo"></p>
                </div>
            </div>

            <div class="profile-actions">
                <a href="inicio.html" class="btn btn-orange">Voltar ao início</a>
                <button type="button" class="btn-blue" id="btn-editar">Editar perfil</button>
                <a href="senhanova.html" class="btn btn-orange">Editar senha</a>
            </div>

        </section>

                <section class="data-grid">

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" readonly name="nome" autocomplete="name">
            </div>

            <div class="input-group">
                <label for="email">Email Corporativo</label>
                <input type="email" id="email" readonly name="email">
            </div>

            <div class="input-group">
                <label for="CPF">CPF</label>
                <input type="text" id="CPF" readonly name="CPF">
            </div>

            <div class="input-group">
                <label for="Telefone">Telefone</label>
                <input type="text" id="Telefone" readonly name="Telefone" placeholder="(61) 90000-0000" autocomplete="tel">
            </div>

            <div class="input-group">
                <label for="Cargo">Cargo</label>
                <input type="text" id="Cargo" readonly name="Cargo">
            </div>

            <div class="input-group">
                <label for="Nivel">Nível de Acesso</label>
                <input type="text" id="Nivel" readonly name="Nivel de acesso">
            </div>

            <div class="input-group">
                <label for="Departamento">Departamento</label>
                <input type="text" id="Departamento" readonly name="Departamento">
            </div>

            <a class="btn-logout" href="index.html" id="btn-sair">
                <img src="assets/icons/iconUpload.svg" alt="Sair" class="logo-logout">
                Sair
            </a>

        </section>

    <p id="msg" class="msg" role="alert" style="grid-column:1/-1"></p>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/conta.js"></script>

</body>
</html>
