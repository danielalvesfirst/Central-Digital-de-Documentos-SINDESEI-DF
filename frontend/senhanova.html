<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir senha - SINDESEI-DF</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <img class="logo" src="assets/logos/Sindesei-DF-padrao.svg" alt="SINDESEI-DF">
    <h1 id="titulo">Defina sua senha</h1>
    <p class="lead">Mínimo de 8 caracteres, com um número e um caractere especial.</p>
    <form id="form-nova-senha">
        <div id="linha-atual" hidden><label class="sr-only" for="senha-atual">Senha atual</label>
        <input type="password" id="senha-atual" placeholder="Senha atual" autocomplete="current-password"></div>
        <label class="sr-only" for="nova-senha">Nova senha</label>
        <input type="password" id="nova-senha" placeholder="Nova senha" autocomplete="new-password" minlength="8" pattern="(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="Pelo menos 8 caracteres, com um número e um caractere especial." required>
        <label class="sr-only" for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" placeholder="Confirmar senha" autocomplete="new-password" minlength="8" required>
        <p id="msg" class="msg" role="alert"></p>
        <button type="submit">Confirmar mudança</button>
    </form>
    <a href="index.html">Voltar ao login</a>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
