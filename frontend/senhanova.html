<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/01style.css">

</head>
<body>
     <img class="logo" src="assets/logos/Sindesei-DF-padrao.svg">
     <h1>Defina sua senha</h1>
    
    <p>Crie uma nova senha segura para sua conta.</p>
    
    <form>
        <label for="email"></label>
        <input type="email" name="email" id="email" placeholder="Exemplo@gmail.com" > 
    
        
        <label for="nova-senha"></label>
        <input type="password" id="nova-senha" name="nova-senha" placeholder=" Nova Senha" minlength="8" pattern="(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="A senha deve ter pelo menos 8 caracteres, incluindo um número e um caractere especial." required>
          
        
         <label for="confirmar-senha"></label>
         <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder=" Confirmar Senha" minlength="8" pattern="(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="A senha deve ter pelo menos 8 caracteres, incluindo um número e um caractere especial." required>
          
        
         <button type="submit">Redefinir senha</button>
         
    </form>
     <a href="index.html">Voltar a página de login</a>
</body>
</html>
